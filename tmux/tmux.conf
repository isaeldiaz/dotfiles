if-shell "which zsh > /dev/null 2>&1" "set -g default-shell /bin/zsh" "set -g default-shell /bin/bash"

# tmux-256color gives italics and correct nested behaviour. Fall back to
# screen-256color when the terminfo entry is missing (older RHEL/CentOS).
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
  "set -g default-terminal tmux-256color" \
  "set -g default-terminal screen-256color"

# True color support (tmux 3.2+), plus OSC 52 clipboard.
#
# WezTerm reports TERM=xterm-256color, so that is the pattern to match. The
# 'clipboard' feature is what tells tmux the outer terminal understands OSC 52;
# without it `set-clipboard on` is a silent no-op and copy only ever reaches the
# tmux paste buffer.
set -as terminal-features 'xterm-256color:RGB:clipboard'
# Belt and braces for tmux < 3.2, where terminal-features does not exist:
# the same Ms capability set the old way. Harmless on modern tmux. Note the
# xterm* pattern -- the previous vte* one never matched WezTerm.
set -ag terminal-overrides ",xterm*:Ms=\E]52;c;%p2%s\7"

# Set clipboard
set -g set-clipboard on

# Let nested tmux and TUIs (nvim's OSC 52, image protocols) reach the outer
# terminal untouched.
set -g allow-passthrough on

# WezTerm keeps 20000 lines; the tmux default of 2000 would throw away history
# long before that and make scrollback feel broken.
set -g history-limit 50000

# Set your prefix 
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Window navigation (mirrors WezTerm tab navigation)
bind Space next-window
bind S-Space previous-window

# Window management (mirrors WezTerm)
unbind c
bind n new-window  # Create new window: prefix + n (mirrors WezTerm)
bind w kill-window # Close window: prefix + w (mirrors WezTerm)

# Pane splits (mirrors WezTerm)
unbind %
unbind '"'
bind | split-window -h   # Split vertically: prefix + | (mirrors WezTerm)
bind '\' split-window -h # Also allow backslash without shift
bind - split-window -v   # Split horizontally: prefix + - (mirrors WezTerm)

# Reload config (mirrors WezTerm)
unbind r
bind r source-file ~/.tmux.conf # Refresh conf: prefix + r

# Resize panes: prefix + [h,j,k,l] (mirrors WezTerm)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Zoom pane (mirrors WezTerm)
bind z resize-pane -Z

# Kill pane
bind x kill-pane

# Mouse on: the wheel scrolls tmux history instead of WezTerm's (useless)
# per-pane scrollback, and clicks select panes. Hold SHIFT to bypass mouse
# reporting entirely and get WezTerm's own selection -- see
# bypass_mouse_reporting_modifiers in the WezTerm config.
set -g mouse on
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

set-window-option -g mode-keys vi

# Copy mode and paste (Norwegian keyboard friendly - no Alt required)
bind Escape copy-mode    # Enter copy mode: prefix + Escape
bind p paste-buffer      # Paste: prefix + p

# With terminal-features 'clipboard' set above, tmux emits OSC 52 itself, so
# plain copy-selection reaches the Windows clipboard. No base64/xargs shell-out
# (which also broke on selections past the xargs argument limit).
bind-key -T copy-mode-vi 'v' send -X begin-selection      # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel
# Mouse drag copies but stays in copy mode, so the selection can be adjusted.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

set-option -g focus-events on # send focus events to the applications running when switching panes

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# List of plugins
# INSTALL   prefix + I
# UPDATE    prefix + U
# Uninstall prefix + alt + u

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/default/green'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
